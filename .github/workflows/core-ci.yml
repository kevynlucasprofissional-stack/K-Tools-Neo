name: K-Tools CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ktools-core
        run: python -m pip install -e ./packages/ktools-core

      - name: Install ktools-json
        run: python -m pip install -e ./packages/ktools-json

      - name: Install ktools-text
        run: python -m pip install -e ./packages/ktools-text

      - name: Install ktools-pdf
        run: python -m pip install -e ./packages/ktools-pdf

      - name: Install ktools-documents
        run: python -m pip install -e ./packages/ktools-documents

      - name: Install ktools-images
        run: python -m pip install -e ./packages/ktools-images

      - name: Core unit and contract tests
        run: python -m unittest discover -s packages/ktools-core/tests -v

      - name: JSON node pack tests
        run: python -m unittest discover -s packages/ktools-json/tests -v

      - name: Text node pack tests
        run: python -m unittest discover -s packages/ktools-text/tests -v

      - name: PDF node pack tests
        run: python -m unittest discover -s packages/ktools-pdf/tests -v

      - name: Documents node pack tests
        run: python -m unittest discover -s packages/ktools-documents/tests -v

      - name: Image node pack tests
        run: python -m unittest discover -s packages/ktools-images/tests -v

      - name: Core CLI smoke
        run: python -m ktools_core packages/ktools-core/examples/hello-workflow.json --json

      - name: JSON workflow CLI smoke
        run: python -m ktools_json "${{ github.workspace }}/packages/ktools-json/examples/split-workflow.json" --json
        working-directory: ${{ runner.temp }}

      - name: Verify JSON node pack smoke artifacts
        run: python -c "import os,json; d='oc001-split-out'; assert [f for f in os.listdir(d) if f.endswith('.json')], 'no parts written'; assert json.load(open(os.path.join(d,'records_parte_01_de_02.json'))), 'part invalid'"
        working-directory: ${{ runner.temp }}

      - name: Text merge workflow smoke
        run: python packages/ktools-text/examples/run_merge_workflow.py "${{ runner.temp }}/ktools-text-smoke/merged.md"

      - name: Verify Text merge workflow smoke artifact
        run: python -c "from pathlib import Path; p=Path(r'${{ runner.temp }}')/'ktools-text-smoke'/'merged.md'; assert p.read_text(encoding='utf-8') == 'Alpha\n\nBeta\n\n', p.read_text(encoding='utf-8')"

      - name: Text split to merge workflow smoke
        run: python packages/ktools-text/examples/run_split_merge_workflow.py "${{ runner.temp }}/ktools-text-split-smoke"

      - name: PDF merge workflow smoke
        run: python packages/ktools-pdf/examples/run_merge_workflow.py "${{ runner.temp }}/ktools-pdf-smoke/merged.pdf"

      - name: Verify PDF merge workflow smoke artifact
        run: python -c "from pathlib import Path; from pypdf import PdfReader; p=Path(r'${{ runner.temp }}')/'ktools-pdf-smoke'/'merged.pdf'; r=PdfReader(str(p), strict=False); dims=[(float(x.mediabox.width),float(x.mediabox.height)) for x in r.pages]; assert dims == [(101.0,201.0),(102.0,202.0),(301.0,401.0)], dims"

      - name: PDF split to merge workflow smoke
        run: python packages/ktools-pdf/examples/run_split_merge_workflow.py "${{ runner.temp }}/ktools-pdf-split-smoke"

      - name: Documents mixed split workflow smoke
        run: python packages/ktools-documents/examples/run_mixed_split_workflow.py "${{ runner.temp }}/ktools-documents-smoke"

      - name: Images WebP to PNG workflow smoke
        run: python packages/ktools-images/examples/run_webp_to_png_workflow.py "${{ runner.temp }}/ktools-images-webp-smoke"

      - name: Images to PDF workflow smoke
        run: python packages/ktools-images/examples/run_images_to_pdf_workflow.py "${{ runner.temp }}/ktools-images-pdf-smoke"

  xyflow-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/xyflow-editor

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/xyflow-editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Deterministic tests
        run: npm exec vitest -- run