name: K-Tools Core CI

on:
  push:
    branches: [main]
    paths:
      - "packages/ktools-core/**"
      - ".github/workflows/core-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/ktools-core/**"
      - ".github/workflows/core-ci.yml"

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ktools-core
        run: python -m pip install -e ./packages/ktools-core

      - name: Unit and contract tests
        run: python -m unittest discover -s packages/ktools-core/tests -v

      - name: CLI smoke
        run: python -m ktools_core packages/ktools-core/examples/hello-workflow.json --json
