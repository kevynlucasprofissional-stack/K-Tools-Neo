name: K-Tools CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ktools-core
        run: python -m pip install -e ./packages/ktools-core

      - name: Unit and contract tests
        run: python -m unittest discover -s packages/ktools-core/tests -v

      - name: CLI smoke
        run: python -m ktools_core packages/ktools-core/examples/hello-workflow.json --json

  xyflow-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/xyflow-editor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/xyflow-editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Deterministic tests
        run: npm exec vitest -- run
