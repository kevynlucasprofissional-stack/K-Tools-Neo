[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ktools-images"
version = "0.1.0"
description = "Official K-Tools image node pack"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "K-Tools Neo" }]
dependencies = [
  "ktools-core>=0.1.0",
  "Pillow>=12,<13",
]

[tool.setuptools.packages.find]
where = ["src"]
