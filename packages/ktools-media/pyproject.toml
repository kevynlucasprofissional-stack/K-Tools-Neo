[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ktools-media"
version = "0.1.0"
description = "Official K-Tools media node pack"
requires-python = ">=3.10"
authors = [{ name = "K-Tools Neo" }]
dependencies = [
  "ktools-core>=0.1.0",
  "imageio-ffmpeg>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
