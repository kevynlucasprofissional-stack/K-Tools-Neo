name: Build & Release

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project, tests and PyInstaller
        run: pip install ".[dev]" pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Compile smoke
        run: python -m compileall -q yt_dlp_tui
      - name: Build Windows executable
        run: pyinstaller --clean --noconfirm yt-dlp-tui.spec
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/yt-dlp-tui.exe")) { throw "yt-dlp-tui.exe nao foi gerado" }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/yt-dlp-tui.exe
